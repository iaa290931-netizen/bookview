   name: build-exe
   on:
     push:
     workflow_dispatch:
   jobs:
     build:
       runs-on: windows-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with:
             python-version: "3.12"
         - run: pip install pygame numpy pyinstaller
         - run: pyinstaller --onefile --noconsole --name BookView bookview.py
         - uses: actions/upload-artifact@v4
           with:
             name: BookView-exe
             path: dist/BookView.exe
